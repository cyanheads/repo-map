[tool.poetry]
name = "repo-map"
version = "0.7.1"
description = "Generate a comprehensive summary and visualization of a repository structure, enhanced with AI-powered descriptions and developer considerations."
authors = ["Cyanheads <casey@caseyjhand.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "repo_map", from = "src" }]

[tool.poetry.urls]
"Homepage" = "https://github.com/cyanheads/repo-map"

[tool.poetry.group.dev.dependencies]
ruff = "*"
black = "*"
pytest = "*"

[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "^3.13.3"
certifi = "^2026.2.25"
pathspec = "^1.0.4"
tqdm = "^4.67.3"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
tree-sitter = "^0.21.3"
tree-sitter-languages = "^1.10.2"
types-tqdm = "^4.67.3.20260303"

[tool.poetry.scripts]
repo-map = "repo_map.main:run_main"
format = "scripts:run_format"
sync-skills = "scripts:run_sync_skills"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]

[tool.pylint."MESSAGES CONTROL"]
disable = "C0301"
