[project]
name = "repo-map"
version = "0.14.0"
description = "Map a repository as a Markdown tree with LLM-written notes on each file."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cyanheads", email = "casey@caseyjhand.com" }]
requires-python = ">=3.12"
keywords = ["repository", "codebase", "documentation", "llm", "openrouter", "markdown", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.14.5",
    "certifi>=2026.7.22",
    "pathspec>=1.1.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "tqdm>=4.70.1",
]

[project.urls]
Homepage = "https://github.com/cyanheads/repo-map"
Repository = "https://github.com/cyanheads/repo-map"
Issues = "https://github.com/cyanheads/repo-map/issues"
Changelog = "https://github.com/cyanheads/repo-map/blob/main/CHANGELOG.md"

[project.scripts]
repo-map = "repo_map.main:run_main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown: resolve only releases at least this old.
exclude-newer = "3 days"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
