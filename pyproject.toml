[tool.poetry]
name = "repo-map"
version = "0.10.2"
description = "Generate a comprehensive summary and visualization of a repository structure, enhanced with AI-powered descriptions and developer considerations."
authors = ["Cyanheads <casey@caseyjhand.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "repo_map", from = "src" }]

[tool.poetry.urls]
"Homepage" = "https://github.com/cyanheads/repo-map"

[tool.poetry.group.dev.dependencies]
ruff = "*"
black = "*"
pytest = "*"

[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "^3.13.3"
certifi = "^2026.2.25"
pathspec = "^1.0.4"
tqdm = "^4.67.3"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"

[tool.poetry.scripts]
repo-map = "repo_map.main:run_main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
